<!-- Supabase → Authentication → Emails → Reset Password. Subject: Reset your Tidelight password -->
<div style="background:#0F1111;padding:32px 20px;font-family:Helvetica,Arial,sans-serif;color:#ECE8E1">
  <div style="max-width:520px;margin:0 auto">
    <p style="font-family:Menlo,monospace;font-size:11px;letter-spacing:4px;color:#D9A066;margin:0 0 8px">TIDELIGHT</p>
    <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:30px;line-height:1.1;margin:0 0 16px">Reset your <em style="color:#D9A066">password.</em></h1>
    <p style="font-size:15px;line-height:1.6;color:#A3A6A4;margin:0 0 24px">Someone (hopefully you) asked to reset the password for {{ .Email }}. Tap the button on the device you use Tidelight on, then choose a new password.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#D9A066;color:#1A130B;text-decoration:none;font-weight:700;font-size:15px;padding:14px 26px;border-radius:999px">Choose a new password</a>
    <p style="font-size:13px;line-height:1.6;color:#A3A6A4;margin:24px 0 0">If you didn't ask for this, you can ignore this email. Your password won't change.</p>
  </div>
</div>
