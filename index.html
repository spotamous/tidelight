<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tidelight</title>
  <meta name="description" content="Personal seascape and landscape light planner: sky, tide and sea in one go/no-go score that learns your taste.">
  <meta name="theme-color" content="#0B0D12">
  <script>/* set the theme before anything paints, so daylight doesn't flash dark */
    try { var t = localStorage.getItem('tidelight:theme') || 'dark'; if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script>/* Catch errors from the very start. If the app can't start (say a file didn't finish updating),
     show a way out instead of a blank screen, and report it. Once the app is running, js/report.js takes over. */
    window.__tl = { errs: [], booted: false };
    (function () {
      var shown = false;
      function rescue() {
        if (window.__tl.booted || shown || !document.body) return;
        shown = true;
        var d = document.createElement('div');
        d.className = 'boot-fail';
        d.innerHTML = '<h1>Tidelight couldn’t start</h1><p>Usually a file didn’t finish updating. Your spots, plans and photos are safe on this phone.</p>' +
          '<button id="bfReload">Reload</button><button id="bfClean">Clear the saved app and reload</button>' +
          '<p class="bf-small">If it keeps happening, tell Tyson. This has been reported.</p>';
        document.body.appendChild(d);
        document.getElementById('bfReload').onclick = function () { location.reload(); };
        document.getElementById('bfClean').onclick = function () {
          // the app's code only; your data lives elsewhere and is kept
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.filter(function (n) { return n.indexOf('tidelight-shell') === 0; }).map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        };
        send();
      }
      function send() {
        // the app's own reporter never loaded, so post straight to Supabase with the public key
        import('./js/config.js').then(function (c) {
          if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY) return;
          var e = window.__tl.errs[0] || {};
          return fetch(c.SUPABASE_URL + '/rest/v1/app_errors', { method: 'POST', headers: { apikey: c.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + c.SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
            body: JSON.stringify({ kind: 'startup', message: String(e.message || 'Could not start').slice(0, 500), source: e.source ? String(e.source).slice(0, 200) : null, stack: e.stack ? String(e.stack).slice(0, 2000) : null,
              screen: 'start-up', device: (navigator.userAgent.slice(0, 170) + ' | ' + innerWidth + 'x' + innerHeight).slice(0, 240) }) });
        }).catch(function () {});
      }
      function soon() { setTimeout(rescue, 1500); }
      addEventListener('error', function (e) {
        if (window.__tl.booted) return;
        var el = e.target;
        if (el && el !== window) {
          if (!/^(SCRIPT|LINK)$/.test(el.tagName)) return;   // a missing image isn't fatal
          if (String(el.src || el.href).indexOf(location.origin) !== 0) return;   // a library or font on another site: offline, not a bug
          window.__tl.errs.push({ kind: 'startup', message: 'Could not load ' + String(el.src || el.href).replace(location.origin, '') });
          if (el.type === 'module') soon();
          return;
        }
        window.__tl.errs.push({ kind: 'startup', message: String(e.message || 'error'), source: (e.filename || '').replace(location.origin, '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0), stack: e.error && e.error.stack });
        soon();
      }, true);
      addEventListener('unhandledrejection', function (e) {
        if (window.__tl.booted) return;
        var r = e.reason; window.__tl.errs.push({ kind: 'startup', message: String((r && r.message) || r), stack: r && r.stack });
      });
    })();</script>
  <style>
    .boot-fail { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; gap: 12px; padding: 32px 24px; text-align: center;
      background: #0F1111; color: #EDE8E1; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
    .boot-fail h1 { font-size: 1.4rem; margin: 0; }
    .boot-fail p { margin: 0; color: #B9B2A8; max-width: 32ch; justify-self: center; }
    .boot-fail button { justify-self: center; min-width: 240px; padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: inherit; font: 600 1rem system-ui, sans-serif; }
    .boot-fail #bfReload { background: #D9A066; color: #1B1209; border-color: transparent; }
    .boot-fail .bf-small { font-size: .85rem; }
  </style>

<body>
  <header class="topbar">
    <div class="brand" role="link" tabindex="0" aria-label="Tidelight home: today's forecast" title="Today's forecast">
      <img src="https://tysonwaldron.com/cdn/shop/files/Tyson-Waldron_white_low-res.png?height=70&v=1763355808" alt="Tyson Waldron Photography" height="36"
           onerror="this.outerHTML='&lt;span class=&quot;wordmark-fallback&quot;&gt;Tyson Waldron&lt;/span&gt;'">
      <span class="app-name">Tidelight</span>
    </div>
    <div class="top-actions">
    <button id="nowBtn" class="now-btn" aria-label="Right now: current conditions and radar" title="Right now">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg>
      <span>Now</span><i class="live-dot" aria-hidden="true"></i>
    </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <span class="tab-ind" aria-hidden="true"></span>
    <button data-tab="forecast" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17h18"/><path d="M7 17a5 5 0 0 1 10 0"/><path d="M12 6v2M5.6 9.6l1.4 1.4M18.4 9.6 17 11M4 21h16"/></svg>
      <span>Forecast</span>
    </button>
    <button data-tab="spots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Spots</span>
    </button>
    <button data-tab="plans">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      <span>Plans</span>
    </button>
    <button data-tab="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      <span>Tools</span>
    </button>
    <button data-tab="you">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
      <span>You</span>
    </button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <button class="sheet-close icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
